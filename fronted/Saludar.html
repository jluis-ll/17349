<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludar</title>
</head>

<body>
    <h1>Saludar</h1>

    <button onclick="saludar()">saludar Fetch</button>
    <button onclick="saludar2()">saludar XHR</button>



    <script>
        function saludar() {
            url = "http://localhost:8081/saludos"
            fetch(url)
                .then(resspuesta => {
                    r = resspuesta.text()
                    console.log( r )
                    return r
                })
                .then(datos => {
                    console.log(datos)
                })
                .catch(error => {
                    console.log(error)
                })
        }



        function saludar2() {
            url = "http://localhost:8081/saludos"
            xhttp = new XMLHttpRequest()
            xhttp.onload = () => {
                console.log(xhttp.response)
            }
            xhttp.open("GET", url)
            xhttp.send()
        }
    </script>
</body>

</html>
